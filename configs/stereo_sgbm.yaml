# OpenCV StereoSGBM & Continuous Stereo Correspondence Hyperparameters
engine: "raft"                 # "sgbm", "raft", or "auto" (raft falls back to sgbm if unavailable)

stereo_sgbm:
  min_disparity: 0
  num_disparities: 256          # Divisible by 16; covers realistic fruit picking depth range (200mm - 2000mm)
  block_size: 11                # Matched block window size (11-15 for uniform fruit texture)
  p1: 2904                      # 8 * channels * block_size^2 (8 * 3 * 11^2)
  p2: 11616                     # 32 * channels * block_size^2 (32 * 3 * 11^2)
  disp12_max_diff: 2            # Left-Right consistency check tolerance
  pre_filter_cap: 31
  uniqueness_ratio: 5           # Reduced to 5% to prevent dropout on smooth textureless fruit surfaces
  speckle_window_size: 120      # Window size to smooth mosaic speckle artifacts
  speckle_range: 2              # Maximum disparity variation within speckle component
  mode: 3                       # cv2.STEREO_SGBM_MODE_SGBM_3WAY

wls_filter:
  enabled: true
  lambda: 10000.0               # Disparity smoothness regularizer for uniform fruit surfaces
  sigma: 1.8                    # Color sensitivity relative to reference RGB frame

mask_refinement:
  enabled: true                 # Continuous disparity interpolation & surface smoothing inside YOLO masks
  method: "continuous_surface"  # "continuous_surface" or "ncc_patch"
  bilateral_diameter: 9
  bilateral_sigma_color: 15.0
  bilateral_sigma_space: 15.0

raft_stereo:                    # Official RAFT-Stereo (third_party/raft_stereo), pretrained, no fine-tuning
  model_path: "weights/raftstereo-middlebury.pth"
  corr_levels: 4
  corr_radius: 4
  corr_implementation: "reg"    # "reg"/"alt" are pure PyTorch; "reg_cuda"/"alt_cuda" need the compiled upstream extensions
  iters: 20                     # GRU refinement iterations (upstream 32); 20 = 1.45x faster, valid centroids within ~2 mm of 32 iters
  mixed_precision: true         # fp16 autocast on CUDA
  device: "cuda"                # "cuda", "cuda:N", "cpu", or "auto"

sky_suppression:
  enabled: true
  luminance_threshold: 245      # Saturated luminance threshold to filter out bright sky glare
